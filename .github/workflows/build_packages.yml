name: Build Linux Packages

on:
  push:
    branches:
      - master
      - linux
      - WebUI
    tags:
      - '*'

# Amatsukazeのビルドは、必要なツールチェインの異なる2つの環境へ分割している。
#  - ネイティブ (C++): Ubuntu 20.04。ここでビルドしたものは glibc 2.31 以降の
#    ディストリで動くため、配布パッケージはOSバージョン別に分けず1本にする。
#  - .NET: Ubuntu 24.04。20.04 には .NET 10 SDK が提供されない。
#    .NET側の成果物は自己完結型で発行され、ビルドホストのglibcには依存しない。
# 最後に package ジョブで両者を1つのツリーに重ねて配布パッケージを作る。
jobs:
  build-native:
    name: Build native (Ubuntu 20.04)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Build native
        run: |
          # 古いキャッシュを掴まないよう、ベースイメージを明示的に取得する
          docker pull ghcr.io/${{ github.repository_owner }}/amatsukaze-builder:ubuntu2004 || true
          docker build \
            --build-arg GHCR_OWNER=${{ github.repository_owner }} \
            --tag build_amatsukaze_native \
            --file docker/docker_ubuntu2004 ./
          docker run -dit --rm \
            -v ${{ github.workspace }}:/work \
            --name build_native build_amatsukaze_native
          docker exec build_native git config --global --add safe.directory /work
          docker exec build_native bash -lc "cd /work && ./scripts/build.sh buildAmatsukaze/Amatsukaze --native-only"

      - name: Check ABI floor
        run: |
          # 20.04 でビルドした意味が失われていないことを確認する。
          # RHEL/Rocky/Alma 9 が持つ値 (GLIBC 2.34 / GLIBCXX 3.4.29 / CXXABI 1.3.13) を超えたら失敗させる。
          fail=0
          for f in $(find buildAmatsukaze/Amatsukaze -type f); do
            if ! file -b "${f}" | grep -q "ELF 64"; then continue; fi
            for spec in "GLIBC:2.34" "GLIBCXX:3.4.29" "CXXABI:1.3.13"; do
              sym="${spec%%:*}"
              limit="${spec#*:}"
              max=$(objdump -p "${f}" | grep -oE "\\b${sym}_[0-9][0-9.]*" | sed "s/${sym}_//" | sort -uV | tail -1)
              if [ -n "${max}" ] && [ "$(printf "%s\\n%s\\n" "${max}" "${limit}" | sort -V | tail -1)" != "${limit}" ]; then
                echo "NG: ${f} requires ${sym}_${max} (> ${sym}_${limit})"
                fail=1
              fi
            done
          done
          if [ "${fail}" -ne 0 ]; then exit 1; fi
          echo "ABI floor OK"

      - name: Pack native tree
        run: |
          # アーティファクトは実行属性を保持しないため、tarに包んで受け渡す
          tar -cf native.tar -C buildAmatsukaze/Amatsukaze .

      - name: Upload native tree
        uses: actions/upload-artifact@v4
        with:
          name: amatsukaze-native
          path: native.tar
          retention-days: 1

  build-dotnet:
    name: Build .NET (Ubuntu 24.04)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Check wasm-tools workload
        run: |
          # jobs.container は可変タグの古いイメージがrunnerに残る場合があるため、明示的にpullする。
          docker pull ghcr.io/${{ github.repository_owner }}/amatsukaze-builder:ubuntu2404
          # wasm-tools が無いとWebUIが最適化なしで発行され、静かにサイズが増える。
          # ベースイメージ側で入れているので、無い場合はイメージが古い。
          if ! docker run --rm \
            ghcr.io/${{ github.repository_owner }}/amatsukaze-builder:ubuntu2404 \
            dotnet workload list | grep -q "wasm-tools"; then
            echo "wasm-toolsワークロードがありません。build_base_image.ymlを再実行してベースイメージを更新してください。" >&2
            exit 1
          fi

      - name: Build .NET
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            ghcr.io/${{ github.repository_owner }}/amatsukaze-builder:ubuntu2404 \
            bash -lc 'git config --global --add safe.directory /work && cd /work && ./scripts/build.sh buildAmatsukaze/Amatsukaze --dotnet-only'

      - name: Pack .NET tree
        run: |
          tar -cf dotnet.tar -C buildAmatsukaze/Amatsukaze .

      - name: Upload .NET tree
        uses: actions/upload-artifact@v4
        with:
          name: amatsukaze-dotnet
          path: dotnet.tar
          retention-days: 1

  package:
    name: Upload Release Asset
    needs: [build-native, build-dotnet]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version name
        id: rev
        run: |
          REVCOUNT=`git rev-list --count HEAD`
          if [[ "${{ github.ref }}" =~ "refs/tags/" ]]; then
            VERSION=$(echo ${{ github.ref }} | sed -e "s#refs/tags/##g")
          else
            VERSION=r${REVCOUNT}
          fi
          echo "version_name=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download native tree
        uses: actions/download-artifact@v4
        with:
          name: amatsukaze-native
          path: parts

      - name: Download .NET tree
        uses: actions/download-artifact@v4
        with:
          name: amatsukaze-dotnet
          path: parts

      - name: Create package
        id: create_pkg
        run: |
          # 2つの成果物は内容が重ならないので、同じツリーに重ねるだけでよい
          mkdir -p pkg
          tar -xf parts/native.tar -C pkg
          tar -xf parts/dotnet.tar -C pkg
          PKG_NAME=Amatsukaze_linux_${{ steps.rev.outputs.version_name }}_x64.tar.xz
          tar -Jcf ${PKG_NAME} -C pkg .
          echo "pkg_name=${PKG_NAME}" >> $GITHUB_OUTPUT

      - name: Calc hash
        run: |
          7z h -scrc* ${{ steps.create_pkg.outputs.pkg_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amatsukaze_linux_${{ steps.rev.outputs.version_name }}
          path: ${{ steps.create_pkg.outputs.pkg_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            ${{ steps.create_pkg.outputs.pkg_name }}

  build-docker:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Show Docker info
        run: |
          docker version
          docker info

      - name: Prepare working dirs via setup.sh
        working-directory: docker
        run: |
          chmod +x ./setup.sh
          ./setup.sh

      - name: Install yq
        run: |
          YQ_VERSION=v4.44.3
          yq_tmp=$(mktemp)
          trap 'rm -f "$yq_tmp"' EXIT
          curl --fail --location --no-progress-meter --retry 5 --retry-all-errors --retry-delay 10 --retry-max-time 300 --connect-timeout 15 --max-time 120 --output "$yq_tmp" \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo install -m 0755 "$yq_tmp" /usr/local/bin/yq
          yq --version

      - name: Disable GPU-related blocks in compose.yml (safe delete)
        working-directory: docker
        run: |
          yq -i 'del(.services.amatsukaze.devices, .services.amatsukaze.deploy)' compose.yml
          echo "== composed compose.yml =="
          sed -n '1,200p' compose.yml

      - name: Build images with docker compose
        working-directory: docker
        run: |
          docker compose build

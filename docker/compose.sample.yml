services:
    amatsukaze:
        image: amatsukaze
        container_name: amatsukaze
        build:
          context: ./
          dockerfile: Dockerfile
          args:
            ENABLE_FASTER_WHISPER: "0"  # Faster-Whisper-XXLを含める場合は "1" に変更
            ENABLE_VCEENC_AMF: "0"  # VCEEncCでAMFも使う場合は "1" に変更 (既定はVA-APIのみ)
        restart: always
        ports:
          - "32768:32768"
          - "32769:32769"
        environment:
          # Amatsukazeを実行するユーザーIDとグループIDを指定
          - RUN_UID=1000
          - RUN_GID=1000
        volumes:
          - ./avs:/app/avs
          - ./bat:/app/bat
          - ./config:/app/config
          - ./data:/app/data
          - ./drcs:/app/drcs
          - ./JL:/app/JL
          - ./logo:/app/logo
          - ./profile:/app/profile
          - ./input:/app/input
          - ./output:/app/output
          - /tmp:/tmp
        # QSVEncC/VCEEncCを使うための設定
        # /dev/driが環境にない場合は無効化が必要
        devices:
          - /dev/dri:/dev/dri
          # ENABLE_VCEENC_AMF: "1" でVCEEncCのOpenCLフィルタを使う場合に必要 (ROCm OpenCL)
          # - /dev/kfd:/dev/kfd
          # /dev/kfdを渡す場合に、ROCm非対応のGPU(Ryzen APUの内蔵GPUなど)が同居していると、
          # そのGPUでのVA-APIデコード等でGPUハングが発生することがあるため、
          # 上の /dev/dri の代わりに、使用するGPUのデバイスだけを渡す (複数GPUを使う場合はそれぞれ列挙する)
          # (対応は ls -l /dev/dri/by-path で確認)
          # - /dev/dri/card1:/dev/dri/card1
          # - /dev/dri/renderD128:/dev/dri/renderD128
        # CUDA/NVEncCを使うための設定
        # ホスト側にNVIDIA Graphics DriverとNVIDIA Container Toolkitのインストールが必要
        # NVIDIA GPUが環境にない場合は無効化が必要
        deploy:
          resources:
            reservations:
              devices:
                - driver: nvidia
                  count: all
                  capabilities: [compute, utility, video]
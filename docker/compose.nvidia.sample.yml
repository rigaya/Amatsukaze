services:
    amatsukaze:
        # CUDA/NVEncCを使うためのNVIDIA GPU予約
        # ホスト側にNVIDIA Graphics DriverとNVIDIA Container Toolkitが必要
        deploy:
          resources:
            reservations:
              devices:
                - driver: nvidia
                  count: all
                  capabilities: [compute, utility, video]

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AmatsukazeWebUI</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="AmatsukazeWebUI.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.amatsukazeDnd = {
            lastDropIndex: -1,
            lastDropId: -999,
            dragId: -1,
            setData: function (event) {
                try {
                    if (event && event.dataTransfer) {
                        event.dataTransfer.setData("text/plain", "dnd");
                        event.dataTransfer.effectAllowed = "move";
                        event.dataTransfer.dropEffect = "move";
                        return true;
                    }
                } catch (e) {
                }
                return true;
            },
            setDataWithQueueId: function (event) {
                try {
                    if (event && event.currentTarget && event.currentTarget.dataset) {
                        var id = event.currentTarget.dataset.queueId;
                        if (id !== undefined) {
                            window.amatsukazeDnd.dragId = parseInt(id, 10);
                        }
                    }
                } catch (e) {
                }
                return window.amatsukazeDnd.setData(event);
            },
            setDataWithIndex: function (event) {
                try {
                    if (event && event.currentTarget && event.currentTarget.dataset) {
                        var index = event.currentTarget.dataset.queueIndex;
                        if (index !== undefined) {
                            window.amatsukazeDnd.dragIndex = parseInt(index, 10);
                        }
                    }
                } catch (e) {
                }
                return window.amatsukazeDnd.setData(event);
            },
            getDragId: function () {
                if (typeof window.amatsukazeDnd.dragId === "number" && !isNaN(window.amatsukazeDnd.dragId)) {
                    return window.amatsukazeDnd.dragId;
                }
                return -1;
            },
            clearDragId: function () {
                window.amatsukazeDnd.dragId = -1;
            },
            getDragIndexFromEvent: function (event) {
                try {
                    if (event && event.currentTarget && event.currentTarget.dataset) {
                        var index = event.currentTarget.dataset.queueIndex;
                        if (index !== undefined) {
                            var parsed = parseInt(index, 10);
                            if (!isNaN(parsed)) {
                                return parsed;
                            }
                        }
                    }
                } catch (e) {
                }
                return -1;
            },
            getDragIndex: function () {
                if (typeof window.amatsukazeDnd.dragIndex === "number" && !isNaN(window.amatsukazeDnd.dragIndex)) {
                    return window.amatsukazeDnd.dragIndex;
                }
                return -1;
            },
            setLastDropIndex: function (event) {
                try {
                    if (event && event.currentTarget && event.currentTarget.dataset) {
                        if (event.currentTarget.dataset.queueIndex !== undefined) {
                            var index = parseInt(event.currentTarget.dataset.queueIndex, 10);
                            if (!isNaN(index)) {
                                window.amatsukazeDnd.lastDropIndex = index;
                                return;
                            }
                        }
                        if (event.currentTarget.dataset.dropEnd === "true") {
                            window.amatsukazeDnd.lastDropIndex = -2;
                            return;
                        }
                    }
                } catch (e) {
                }
            },
            setLastDropId: function (event) {
                try {
                    if (event && event.currentTarget && event.currentTarget.dataset) {
                        if (event.currentTarget.dataset.queueId !== undefined) {
                            var id = parseInt(event.currentTarget.dataset.queueId, 10);
                            if (!isNaN(id)) {
                                window.amatsukazeDnd.lastDropId = id;
                                return;
                            }
                        }
                        if (event.currentTarget.dataset.dropEnd === "true") {
                            var prev = event.currentTarget.previousElementSibling;
                            while (prev && (!prev.dataset || prev.dataset.queueId === undefined)) {
                                prev = prev.previousElementSibling;
                            }
                            if (prev && prev.dataset && prev.dataset.queueId !== undefined) {
                                var prevId = parseInt(prev.dataset.queueId, 10);
                                if (!isNaN(prevId)) {
                                    window.amatsukazeDnd.lastDropId = prevId;
                                    return;
                                }
                            }
                            window.amatsukazeDnd.lastDropId = -1;
                            return;
                        }
                    }
                } catch (e) {
                }
            },
            getLastDropIndex: function () {
                return typeof window.amatsukazeDnd.lastDropIndex === "number"
                    ? window.amatsukazeDnd.lastDropIndex
                    : -1;
            },
            getLastDropId: function () {
                return typeof window.amatsukazeDnd.lastDropId === "number"
                    ? window.amatsukazeDnd.lastDropId
                    : -999;
            },
            clearLastDropIndex: function () {
                window.amatsukazeDnd.lastDropIndex = -1;
            },
            clearLastDropId: function () {
                window.amatsukazeDnd.lastDropId = -999;
            },
            clearDragIndex: function () {
                window.amatsukazeDnd.dragIndex = -1;
            },
            setDragIndex: function (index) {
                window.amatsukazeDnd.dragIndex = index;
            },
            onEnter: function (event) {
                try {
                    if (event && event.dataTransfer) {
                        event.preventDefault();
                        return true;
                    }
                } catch (e) {
                }
                return true;
            },
            onOver: function (event) {
                try {
                    if (event && event.dataTransfer) {
                        event.preventDefault();
                        return true;
                    }
                } catch (e) {
                }
                return true;
            }
            ,
            onOverWithIndex: function (event) {
                try {
                    window.amatsukazeDnd.setLastDropIndex(event);
                    if (event && event.dataTransfer) {
                        event.preventDefault();
                        return true;
                    }
                } catch (e) {
                }
                return true;
            },
            onOverWithId: function (event) {
                try {
                    window.amatsukazeDnd.setLastDropId(event);
                    if (event && event.dataTransfer) {
                        event.preventDefault();
                        return true;
                    }
                } catch (e) {
                }
                return true;
            },
            updateDropIndexFromEvent: function (event) {
                try {
                    if (!event) {
                        return true;
                    }
                    if (event.clientX !== undefined && event.clientY !== undefined) {
                        var el = document.elementFromPoint(event.clientX, event.clientY);
                        if (el) {
                            var row = el.closest("tr[data-queue-index]");
                            if (row && row.dataset && row.dataset.queueIndex !== undefined) {
                                var idx = parseInt(row.dataset.queueIndex, 10);
                                if (!isNaN(idx)) {
                                    window.amatsukazeDnd.lastDropIndex = idx;
                                    return true;
                                }
                            }
                            var end = el.closest("[data-drop-end=\"true\"]");
                            if (end) {
                                window.amatsukazeDnd.lastDropIndex = -2;
                            }
                        }
                    }
                } catch (e) {
                }
                return true;
            },
            updateDropIdFromEvent: function (event) {
                try {
                    if (!event) {
                        return true;
                    }
                    if (event.clientX !== undefined && event.clientY !== undefined) {
                        var el = document.elementFromPoint(event.clientX, event.clientY);
                        if (el) {
                            var row = el.closest("tr[data-queue-id]");
                            if (row && row.dataset && row.dataset.queueId !== undefined) {
                                var rect = row.getBoundingClientRect();
                                var usePrev = event.clientY <= rect.top + rect.height / 2;
                                var target = row;
                                if (usePrev) {
                                    var prev = row.previousElementSibling;
                                    while (prev && (!prev.dataset || prev.dataset.queueId === undefined)) {
                                        prev = prev.previousElementSibling;
                                    }
                                    if (prev) {
                                        target = prev;
                                    } else {
                                        window.amatsukazeDnd.lastDropId = -1;
                                        return true;
                                    }
                                }
                                var id = parseInt(target.dataset.queueId, 10);
                                if (!isNaN(id)) {
                                    window.amatsukazeDnd.lastDropId = id;
                                    return true;
                                }
                            }
                            var end = el.closest("[data-drop-end=\"true\"]");
                            if (end) {
                                var prev = end.previousElementSibling;
                                while (prev && (!prev.dataset || prev.dataset.queueId === undefined)) {
                                    prev = prev.previousElementSibling;
                                }
                                if (prev && prev.dataset && prev.dataset.queueId !== undefined) {
                                    var prevId = parseInt(prev.dataset.queueId, 10);
                                    if (!isNaN(prevId)) {
                                        window.amatsukazeDnd.lastDropId = prevId;
                                        return true;
                                    }
                                }
                                window.amatsukazeDnd.lastDropId = -1;
                            }
                        }
                    }
                } catch (e) {
                }
                return true;
            }
        };
        // Trim調整: シークバーのmousedown/mousemove/mouseup対応
        // シークバー本体: ダイレクト移動（スナップなし）
        // シークバー上部（▽マーカー領域）: 最寄り編集点にスナップ
        window.trimAdjustSetupSeekbar = function (dotNetRef) {
            var container = document.querySelector('.trim-seekbar-container');
            var seekbar = document.querySelector('.trim-seekbar');
            if (!container || !seekbar) return;
            // 既存リスナーの重複登録防止
            if (container._trimDragSetup) return;
            container._trimDragSetup = true;
            var dragging = false;
            var markerMaxDist = 20; // ▽クリック有効範囲(px)
            var lastHighlighted = null; // ホバー中のハイライト対象マーカー
            // ドラッグ中はCSS側でjls区間ポップアップを抑止する
            function setDragging(v) {
                dragging = v;
                container.classList.toggle('is-dragging', v);
            }
            function calcRatio(e) {
                var rect = seekbar.getBoundingClientRect();
                if (rect.width <= 0) return -1;
                var r = (e.clientX - rect.left) / rect.width;
                return Math.max(0, Math.min(1, r));
            }
            // マーカー領域（バー上端より上）でかつ最寄り▽が20px以内ならそのマーカーを返す
            function findNearestMarker(e) {
                var rect = seekbar.getBoundingClientRect();
                if (e.clientY >= rect.top) return null; // バー本体上はマーカー判定しない
                var markers = seekbar.querySelectorAll('.trim-seekbar-marker');
                if (!markers.length) return null;
                var best = null, bestDist = Infinity;
                for (var i = 0; i < markers.length; i++) {
                    var mr = markers[i].getBoundingClientRect();
                    var cx = mr.left + mr.width / 2;
                    var dist = Math.abs(e.clientX - cx);
                    if (dist < bestDist) { bestDist = dist; best = markers[i]; }
                }
                return (bestDist <= markerMaxDist) ? best : null;
            }
            // バー下側で最寄りの△分割点マーカーを探す
            function findNearestDivisionMarker(e) {
                var rect = seekbar.getBoundingClientRect();
                if (e.clientY <= rect.bottom) return null;
                var markers = seekbar.querySelectorAll('.trim-seekbar-division-marker');
                if (!markers.length) return null;
                var best = null, bestDist = Infinity;
                for (var i = 0; i < markers.length; i++) {
                    var mr = markers[i].getBoundingClientRect();
                    var cx = mr.left + mr.width / 2;
                    var dist = Math.abs(e.clientX - cx);
                    if (dist < bestDist) { bestDist = dist; best = markers[i]; }
                }
                return (bestDist <= markerMaxDist) ? best : null;
            }
            // バー本体上で最寄りのjls区切り線(区間の左端)がmaxDist(px)以内ならその区間要素を返す
            var jlsSnapDist = 6;
            var lastJlsSnap = null;
            function findNearestJlsBoundary(clientX, clientY, maxDist) {
                var rect = seekbar.getBoundingClientRect();
                if (clientY < rect.top || clientY > rect.bottom) return null;
                var segs = seekbar.querySelectorAll('.trim-jls-seg');
                var best = null, bestDist = Infinity;
                for (var i = 0; i < segs.length; i++) {
                    var dist = Math.abs(clientX - segs[i].getBoundingClientRect().left);
                    if (dist < bestDist) { bestDist = dist; best = segs[i]; }
                }
                return (bestDist <= maxDist) ? best : null;
            }
            function setJlsSnap(seg) {
                if (lastJlsSnap === seg) return;
                if (lastJlsSnap) lastJlsSnap.classList.remove('is-snap');
                lastJlsSnap = seg;
                if (seg) seg.classList.add('is-snap');
            }
            function setHighlight(marker) {
                if (lastHighlighted === marker) return;
                if (lastHighlighted) {
                    lastHighlighted.style.borderTopColor = '';
                    lastHighlighted.style.borderBottomColor = '';
                }
                lastHighlighted = marker;
                if (marker && marker.classList.contains('trim-seekbar-division-marker')) {
                    marker.style.borderBottomColor = '#ff9ac8';
                } else if (marker) {
                    marker.style.borderTopColor = '#ffe060';
                }
            }
            // ホバー: マーカー領域でポインタ形状＋▽ハイライト
            container.addEventListener('mousemove', function (e) {
                if (dragging) return; // ドラッグ中はホバー処理しない
                var rect = seekbar.getBoundingClientRect();
                if (e.clientY >= rect.top && e.clientY <= rect.bottom) {
                    // バー本体上: マーカーのホバー解除、近いjls区切り線を強調
                    setHighlight(null);
                    setJlsSnap(findNearestJlsBoundary(e.clientX, e.clientY, jlsSnapDist));
                    container.style.cursor = '';
                    return;
                }
                setJlsSnap(null);
                var marker = e.clientY < rect.top ? findNearestMarker(e) : findNearestDivisionMarker(e);
                setHighlight(marker);
                container.style.cursor = marker ? 'pointer' : '';
            });
            container.addEventListener('mouseleave', function () {
                if (!dragging) { setHighlight(null); setJlsSnap(null); container.style.cursor = ''; }
            });
            container.addEventListener('mousedown', function (e) {
                if (e.button !== 0) return;
                var r = calcRatio(e);
                if (r < 0) return;
                var marker = findNearestMarker(e);
                if (marker) {
                    // ▽マーカー近傍: 最寄り編集点にスナップ（ドラッグ開始しない）
                    dotNetRef.invokeMethodAsync('OnSeekBarMarkerClick', r);
                } else if ((marker = findNearestDivisionMarker(e))) {
                    // △マーカー近傍: 最寄り分割点にスナップ
                    dotNetRef.invokeMethodAsync('OnSeekBarDivisionMarkerClick', r);
                } else if ((marker = findNearestJlsBoundary(e.clientX, e.clientY, jlsSnapDist))) {
                    // バー本体の区切り線近傍: その区間の先頭へ移動（ドラッグ開始しない）
                    dotNetRef.invokeMethodAsync('OnSeekBarJlsBoundaryClick', parseInt(marker.dataset.frame, 10));
                } else {
                    // シークバー本体: ダイレクト移動＋ドラッグ開始
                    setDragging(true);
                    dotNetRef.invokeMethodAsync('OnSeekBarDrag', r);
                }
                e.preventDefault();
            });
            document.addEventListener('mousemove', function (e) {
                if (!dragging) return;
                var r = calcRatio(e);
                if (r >= 0) dotNetRef.invokeMethodAsync('OnSeekBarDrag', r);
            });
            document.addEventListener('mouseup', function () {
                if (dragging) { setDragging(false); setHighlight(null); setJlsSnap(null); container.style.cursor = ''; }
            });
            // タッチ対応（Android等）
            function calcRatioTouch(e) {
                if (!e.touches || !e.touches.length) return -1;
                var rect = seekbar.getBoundingClientRect();
                if (rect.width <= 0) return -1;
                var r = (e.touches[0].clientX - rect.left) / rect.width;
                return Math.max(0, Math.min(1, r));
            }
            function findNearestMarkerTouch(e) {
                if (!e.touches || !e.touches.length) return null;
                var rect = seekbar.getBoundingClientRect();
                var touchY = e.touches[0].clientY;
                var selector = touchY < rect.top
                    ? '.trim-seekbar-marker'
                    : touchY > rect.bottom
                        ? '.trim-seekbar-division-marker'
                        : null;
                if (!selector) return null;
                var markers = seekbar.querySelectorAll(selector);
                if (!markers.length) return null;
                var touchX = e.touches[0].clientX;
                var best = null, bestDist = Infinity;
                for (var i = 0; i < markers.length; i++) {
                    var mr = markers[i].getBoundingClientRect();
                    var cx = mr.left + mr.width / 2;
                    var dist = Math.abs(touchX - cx);
                    if (dist < bestDist) { bestDist = dist; best = markers[i]; }
                }
                return (bestDist <= 30) ? best : null;
            }
            container.addEventListener('touchstart', function (e) {
                if (e.touches.length !== 1) return;
                var r = calcRatioTouch(e);
                if (r < 0) return;
                var marker = findNearestMarkerTouch(e);
                var jlsSeg;
                if (marker) {
                    dotNetRef.invokeMethodAsync(
                        marker.classList.contains('trim-seekbar-division-marker')
                            ? 'OnSeekBarDivisionMarkerClick'
                            : 'OnSeekBarMarkerClick',
                        r);
                } else if ((jlsSeg = findNearestJlsBoundary(e.touches[0].clientX, e.touches[0].clientY, 10))) {
                    dotNetRef.invokeMethodAsync('OnSeekBarJlsBoundaryClick', parseInt(jlsSeg.dataset.frame, 10));
                } else {
                    setDragging(true);
                    dotNetRef.invokeMethodAsync('OnSeekBarDrag', r);
                }
                e.preventDefault();
            }, { passive: false });
            container.addEventListener('touchmove', function (e) {
                if (!dragging || e.touches.length !== 1) return;
                var r = calcRatioTouch(e);
                if (r >= 0) dotNetRef.invokeMethodAsync('OnSeekBarDrag', r);
                e.preventDefault();
            }, { passive: false });
            container.addEventListener('touchend', function () { setDragging(false); });
            container.addEventListener('touchcancel', function () { setDragging(false); });
        };
        // Trim調整: マウスホイールで1フレームずつ移動
        window.trimAdjustSetupWheel = function (dotNetRef) {
            var page = document.querySelector('.trim-adjust-page');
            if (!page) return;
            if (page._trimWheelSetup) return;
            page._trimWheelSetup = true;
            page.addEventListener('wheel', function (e) {
                if (e.deltaY === 0) return;
                // チェックログオーバーレイ表示中はフレーム移動せず、スクロールに任せる
                if (document.querySelector('.trim-log-overlay')) return;
                dotNetRef.invokeMethodAsync('OnWheel', e.deltaY);
                e.preventDefault();
            }, { passive: false });
        };
        // 正解作成パネル内のキーをBlazorのページ全体ハンドラーから隔離する。
        window.trimAdjustSetupCmSeg = function (panel, dotNetRef) {
            if (!panel || panel._cmSegSetup) return;
            panel._cmSegSetup = true;
            panel.addEventListener('keydown', function (e) {
                e.stopPropagation();
                var row = e.target.closest('[data-cmseg-idx]');
                if (!row || e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
                // 表の端のTabは通常のフォーカス移動に戻し、パネルから出られるようにする。
                var rows = panel.querySelectorAll('[data-cmseg-idx]');
                if (e.key === 'Tab' && ((!e.shiftKey && row === rows[rows.length - 1]) || (e.shiftKey && row === rows[0]))) return;
                if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'Tab' || /^[0-9ab]$/.test(e.key)) {
                    e.preventDefault();
                    dotNetRef.invokeMethodAsync('OnCmSegKeyDown', parseInt(row.dataset.cmsegIdx, 10), e.key, e.shiftKey);
                }
            });
            // 区間表のスクロールを映像のフレーム移動へ渡さない。
            panel.addEventListener('wheel', function (e) { e.stopPropagation(); }, { passive: true });
        };
        window.trimAdjustFocusCmSeg = function (panel, idx) {
            if (!panel) return;
            var row = panel.querySelector('[data-cmseg-idx="' + idx + '"]');
            if (!row) return;
            row.focus({ preventScroll: true });
            row.scrollIntoView({ block: 'nearest' });
        };
        // Trim調整: 再投入後はウィンドウを閉じる（閉じられない場合は戻る）
        window.trimAdjustCloseWindow = function () {
            try {
                window.close();
            } catch (e) {
            }
            setTimeout(function () {
                try {
                    if (!window.closed) {
                        history.back();
                    }
                } catch (e) {
                }
            }, 100);
        };
        window.amatsukazeUi = {
            getScrollInfo: function (element) {
                try {
                    if (!element) {
                        return { scrollTop: 0, scrollHeight: 0, clientHeight: 0, remaining: 0 };
                    }
                    var scrollTop = element.scrollTop || 0;
                    var scrollHeight = element.scrollHeight || 0;
                    var clientHeight = element.clientHeight || 0;
                    var remaining = scrollHeight - scrollTop - clientHeight;
                    return {
                        scrollTop: scrollTop,
                        scrollHeight: scrollHeight,
                        clientHeight: clientHeight,
                        remaining: remaining
                    };
                } catch (e) {
                    return { scrollTop: 0, scrollHeight: 0, clientHeight: 0, remaining: 0 };
                }
            },
            ensureListItemVisible: function (listEl, index) {
                try {
                    if (!listEl || typeof index !== "number") {
                        return;
                    }
                    var items = listEl.querySelectorAll(".path-suggest-item");
                    if (!items || index < 0 || index >= items.length) {
                        return;
                    }
                    var item = items[index];
                    var top = item.offsetTop;
                    var bottom = top + item.offsetHeight;
                    var viewTop = listEl.scrollTop;
                    var viewBottom = viewTop + listEl.clientHeight;
                    if (top < viewTop) {
                        listEl.scrollTop = top;
                    } else if (bottom > viewBottom) {
                        listEl.scrollTop = bottom - listEl.clientHeight;
                    }
                } catch (e) {
                }
            },
            getScrollTop: function (listEl) {
                try {
                    if (!listEl) {
                        return 0;
                    }
                    return listEl.scrollTop || 0;
                } catch (e) {
                    return 0;
                }
            },
            setScrollTop: function (listEl, top) {
                try {
                    if (!listEl || typeof top !== "number") {
                        return;
                    }
                    listEl.scrollTop = top;
                } catch (e) {
                }
            },
            scrollElementOrWindowBy: function (element, deltaY) {
                try {
                    var dy = Number(deltaY) || 0;
                    if (!dy) {
                        return;
                    }
                    if (element) {
                        var canScroll = (element.scrollHeight || 0) > (element.clientHeight || 0) + 1;
                        if (canScroll) {
                            element.scrollTop = (element.scrollTop || 0) + dy;
                            return;
                        }
                    }
                    window.scrollBy({ left: 0, top: dy, behavior: "smooth" });
                } catch (e) {
                }
            },
            scrollElementOrWindowToEdge: function (element, toBottom) {
                try {
                    var bottom = !!toBottom;
                    if (element) {
                        var canScroll = (element.scrollHeight || 0) > (element.clientHeight || 0) + 1;
                        if (canScroll) {
                            element.scrollTop = bottom ? (element.scrollHeight || 0) : 0;
                            return;
                        }
                    }
                    var y = 0;
                    if (bottom) {
                        var doc = document.documentElement;
                        var body = document.body;
                        y = Math.max((doc && doc.scrollHeight) || 0, (body && body.scrollHeight) || 0);
                    }
                    window.scrollTo({ left: 0, top: y, behavior: "smooth" });
                } catch (e) {
                }
            },
            getViewportHeight: function () {
                try {
                    return window.innerHeight || document.documentElement.clientHeight || 0;
                } catch (e) {
                    return 0;
                }
            },
            getViewportWidth: function () {
                try {
                    return window.innerWidth || document.documentElement.clientWidth || 0;
                } catch (e) {
                    return 0;
                }
            },
            openInNewTab: function (url) {
                try {
                    if (!url || typeof url !== "string") {
                        return;
                    }
                    window.open(url, "_blank", "noopener,noreferrer");
                } catch (e) {
                }
            }
        };
        // タッチ端末向け: data-long-press-menu を付けた要素の長押しで contextmenu イベントを発火する
        // iOS Safari は長押しで contextmenu を発火しないため、Blazor側の @oncontextmenu をここから駆動する
        (function () {
            var LONG_PRESS_MS = 500;        // 長押し判定時間
            var MOVE_TOLERANCE_PX = 10;     // この距離以上動いたらスクロール等とみなしキャンセル
            var SUPPRESS_AFTER_MS = 400;    // 長押し後の指離し直後に来る click/contextmenu を抑止する時間
            var timer = null;
            var target = null;
            var startX = 0, startY = 0;
            var pressing = false;           // 長押し発火後、指を離すまで true
            var suppressUntil = 0;
            var suppressedRow = null;
            function cancelTimer() {
                if (timer) {
                    clearTimeout(timer);
                    timer = null;
                }
                target = null;
            }
            function isSuppressing() {
                return pressing || Date.now() < suppressUntil;
            }
            document.addEventListener('touchstart', function (e) {
                cancelTimer();
                pressing = false;
                suppressUntil = 0;
                suppressedRow = null;
                if (!e.touches || e.touches.length !== 1 || !e.target || !e.target.closest) return;
                if (!e.target.closest('[data-long-press-menu]')) return;
                // 入力系要素上では通常操作を優先
                if (e.target.closest('input, select, textarea, button')) return;
                var t = e.touches[0];
                startX = t.clientX;
                startY = t.clientY;
                target = e.target;
                timer = setTimeout(function () {
                    var el = target;
                    timer = null;
                    target = null;
                    if (!el || !el.isConnected) return;
                    pressing = true;
                    suppressedRow = el.closest('[data-long-press-menu]');
                    el.dispatchEvent(new MouseEvent('contextmenu', {
                        bubbles: true, cancelable: true, view: window,
                        clientX: startX, clientY: startY, button: 2
                    }));
                }, LONG_PRESS_MS);
            }, { passive: true, capture: true });
            document.addEventListener('touchmove', function (e) {
                if (!timer || !e.touches || !e.touches.length) return;
                var t = e.touches[0];
                if (Math.abs(t.clientX - startX) > MOVE_TOLERANCE_PX || Math.abs(t.clientY - startY) > MOVE_TOLERANCE_PX) {
                    cancelTimer();
                }
            }, { passive: true, capture: true });
            document.addEventListener('touchend', function (e) {
                cancelTimer();
                if (pressing) {
                    pressing = false;
                    suppressUntil = Date.now() + SUPPRESS_AFTER_MS;
                    // 指を離した際の click 生成を抑止（開いたメニューが即閉じられるのを防ぐ）
                    if (e.cancelable) e.preventDefault();
                }
            }, { passive: false, capture: true });
            document.addEventListener('touchcancel', function () {
                cancelTimer();
                if (pressing) {
                    pressing = false;
                    suppressUntil = Date.now() + SUPPRESS_AFTER_MS;
                }
            }, { passive: true, capture: true });
            // Android等ネイティブの長押し contextmenu と二重発火しないようにする
            window.addEventListener('contextmenu', function (e) {
                if (!e.isTrusted) return;
                if (timer) {
                    // ネイティブが先に来た場合はそちらを採用
                    cancelTimer();
                    return;
                }
                if (isSuppressing()) {
                    var row = e.target && e.target.closest ? e.target.closest('[data-long-press-menu]') : null;
                    if (row && row === suppressedRow) {
                        e.preventDefault();
                        e.stopImmediatePropagation();
                    }
                }
            }, true);
            window.addEventListener('click', function (e) {
                if (Date.now() < suppressUntil && suppressedRow && suppressedRow.contains(e.target)) {
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    suppressUntil = 0;
                    suppressedRow = null;
                }
            }, true);
        })();
    </script>
</body>

</html>
